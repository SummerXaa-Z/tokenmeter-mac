name: Temporary Qwen DMG smoke
on:
  push:
    branches: [test/qwen-summary-dmg-smoke]
permissions:
  contents: read
jobs:
  package:
    if: github.event.before == '7ffd22582924dc8eb972b87c3e2dcf8666d866d3'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: 7ffd22582924dc8eb972b87c3e2dcf8666d866d3
      SELF_SIGN_IDENTITY: TokenMeter-CI-Intentionally-Unavailable
      NOTARIZE: skip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - run: brew install xcodegen
      - name: Verify fresh ad-hoc Release DMG and copied bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          sw_vers
          uname -m
          env -u DEVELOPER_ID_APPLICATION -u NOTARY_KEYCHAIN_PROFILE -u NOTARY_PROFILE \
            -u NOTARY_APPLE_ID -u NOTARY_TEAM_ID -u NOTARY_PASSWORD make package
          original="swift/build/Build/Products/Release/TokenMeter.app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$original/Contents/Info.plist")"
          dmg="/tmp/TokenMeter_${version}_aarch64.dmg"
          shasum -a 256 "$dmg"
          hdiutil verify "$dmg"
          work="$(mktemp -d "$RUNNER_TEMP/tokenmeter-dmg.XXXXXXXX")"
          mkdir "$work/mounted" "$work/installed"
          hdiutil attach -readonly -nobrowse -mountpoint "$work/mounted" "$dmg"
          trap 'hdiutil detach "$work/mounted"' EXIT
          copied="$work/installed/TokenMeter.app"
          ditto "$work/mounted/TokenMeter.app" "$copied"
          codesign --verify --deep --strict --verbose=2 "$copied"
          signature="$(codesign -dvv "$copied" 2>&1)"
          printf '%s\n' "$signature"
          grep -qx 'Signature=adhoc' <<< "$signature"
          ./swift/scripts/verify-release-metadata.sh "$copied" arm64
          cmp "$original/Contents/MacOS/TokenMeter" "$copied/Contents/MacOS/TokenMeter"
          printf 'TOKENMETER_SMOKE_APP=%s\n' "$copied" >> "$GITHUB_ENV"
      - name: Attempt native launch only in a sterile GUI session
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(stat -f %Su /dev/console)" != "$(id -un)" ]] ||
             ! launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo "::notice::No active GUI session; downloaded Gatekeeper, launch and menu bar not tested."
            exit 0
          fi
          defaults write com.deepseek.monitor.mac autoUpdateCheckEnabled -bool false
          defaults write com.deepseek.monitor.mac notificationsEnabled -bool false
          open -n "$TOKENMETER_SMOKE_APP"
          pid=""
          for _ in {1..12}; do
            pid="$(pgrep -f "^$TOKENMETER_SMOKE_APP/Contents/MacOS/TokenMeter([[:space:]]|$)" || true)"
            [[ -z "$pid" ]] || break
            sleep 1
          done
          test -n "$pid"
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 3
          kill -0 "$pid"
          echo "::notice::Copied ad-hoc bundle launched and remained alive; menu-bar interaction and downloaded Gatekeeper not tested."
