name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run release check
        run: make release-check

      - name: UI interaction regression
        run: make ui-test

      - name: Upload generated project for validation
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: generated-project
          path: swift/TokenMeter.xcodeproj/

      - name: Render determinism gate
        run: make ui-render-determinism

      - name: Upload render diff artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: render-determinism-failure
          path: .ui-review/render-determinism-failure/
          if-no-files-found: ignore
