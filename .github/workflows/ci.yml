name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run release check
        run: make release-check

      - name: UI interaction regression
        run: make ui-test

      - name: Verify generated project is committed
        run: git diff --exit-code -- swift/TokenMeter.xcodeproj

      - name: Render determinism gate
        run: make ui-render-determinism

      - name: Upload render diff artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: render-determinism-failure
          path: .ui-review/render-determinism-failure/
          if-no-files-found: ignore

      - name: Upload failed UI test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test-failure
          path: swift/build/Logs/Test/*.xcresult
          if-no-files-found: ignore
