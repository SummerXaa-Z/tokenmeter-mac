name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run release check
        run: make release-check

      - name: Render determinism gate
        run: make ui-render-determinism

      - name: Upload render diff artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: render-determinism-failure
          path: .ui-review/render-determinism-failure/
          if-no-files-found: ignore

      - name: Capture fixed viewport evidence
        run: |
          for run in 1 2 3; do
            make ui-render UI_RENDER_DIR="viewport-evidence/run-$run"
          done

      - name: Upload viewport evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fixed-viewport-evidence
          path: viewport-evidence/
          if-no-files-found: error
